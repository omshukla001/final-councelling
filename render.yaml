services:
  - type: web
    name: counsellor-wala-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: false
      - key: APP_NAME
        value: Counsellor Wala
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: councler_v2
      - key: FIREBASE_CREDENTIALS_BASE64
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: jeecouncelling
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: OTP_SECRET_SALT
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_ENABLED
        value: false
      - key: WEB_CONCURRENCY
        value: 1
