# Shared proxy directives — included by each location block in nginx.conf.
# Install to: /etc/nginx/deploy/nginx.proxy.conf  (paths are relative to /etc/nginx)
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Connection        "";

# Fail fast if upstream is gone; let the client retry.
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
# proxy_read_timeout overridden per-location where needed.

# Buffering off for streaming endpoints (AI chat). Safe default for others too.
proxy_buffering off;
