# /etc/nginx/sites-available/councler
# After copying, symlink: sudo ln -s /etc/nginx/sites-available/councler /etc/nginx/sites-enabled/
# Run certbot AFTER this file is in place and DNS is pointing at the EC2 public IP:
#   sudo certbot --nginx -d your-domain.com -d www.your-domain.com

# Upstream to the backend container (bound to 127.0.0.1:8000 by docker-compose.prod.yml)
upstream councler_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Global rate-limit zones — tuned for a small-to-medium JEE counselling site.
# Adjust `rate` once you have traffic data.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_ai:10m      rate=20r/m;

# ── HTTP → HTTPS redirect (certbot will rewrite this block on first run) ───
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Allow ACME challenge through even when the rest is redirected.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ───────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # TLS (certbot will fill these in on first run; placeholders until then)
    # ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers (defense in depth; FastAPI middleware also sets some) ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Upload / body limits ──
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # ── Gzip compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/x-font-ttf font/opentype image/svg+xml;
    gzip_min_length 1024;

    # ── Auth endpoints — tighter rate limit ──
    location ~ ^/api/v1/(auth|login|otp|register|password) {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://councler_backend;
        include deploy/nginx.proxy.conf;
    }

    # ── AI endpoints — moderate limit (LLMs are expensive) ──
    location ~ ^/api/v1/(ai-chat|counsellor|recommendation-service/recommendations) {
        limit_req zone=api_ai burst=10 nodelay;
        proxy_read_timeout 120s;  # LLM calls can be slow
        proxy_pass http://councler_backend;
        include deploy/nginx.proxy.conf;
    }

    # ── Razorpay webhook — unlimited + longer timeout (retries on failure) ──
    location = /api/v1/payments/razorpay/webhook {
        proxy_read_timeout 30s;
        proxy_pass http://councler_backend;
        include deploy/nginx.proxy.conf;
    }

    # ── General API ──
    location /api/ {
        limit_req zone=api_general burst=30 nodelay;
        proxy_pass http://councler_backend;
        include deploy/nginx.proxy.conf;
    }

    # ── Health check (no rate limit; used by load balancer if any) ──
    location = /health {
        proxy_pass http://councler_backend;
        access_log off;
        include deploy/nginx.proxy.conf;
    }

    # ── Everything else (SPA + static assets served by FastAPI) ──
    location / {
        proxy_pass http://councler_backend;
        include deploy/nginx.proxy.conf;
    }
}
